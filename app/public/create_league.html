<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Create League</title>
</head>
<body>

<p>You made it to the create league page</p>
<div>
  <label for="leagueName">League Name:</label>
  <input id="leagueName" type="text" name="leagueName">
</div>
<div>
  <label for="leagueType">League Type:</label>
  <select id="leagueType" name="leagueType">
    <option value="">Please select your league's type</option>
    <option value="totalPoints">Total points</option>
    <option value="h2h">Head 2 Head</option>
  </select>
</div>
<div><button id="submit">Submit League</button></div>
<div id="message"></div>
<script>
    let button = document.getElementById("submit");
    let message = document.getElementById("message");
    async function submitPressed(){
        let response = await fetch("/create_league");
        let data = await response.text();
        console.log(response.status);
        if (!response.ok){
          message.style.color = "red";
          message.textContent = data;
        }else{
          message.style.color = "black";
          message.textContent = "You successfully created a league";
          console.log(response.status);
        }
        console.log(data);

    }
    button.addEventListener("click", submitPressed)

</script>

</body>
</html>
